services:
  - type: web
    name: vulnguard-ai-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run db:deploy && npm run db:seed && npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vulnguard-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: nvidia
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://vulnguard-ai-frontend.onrender.com
      - key: AI_SERVICE_URL
        value: https://vulnguard-ai-nvidia.onrender.com
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: vulnguard-ai-nvidia
          envVarKey: AI_SERVICE_TOKEN

  - type: web
    name: vulnguard-ai-nvidia
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: AI_SERVICE_TOKEN
        generateValue: true

  - type: web
    name: vulnguard-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: vulnguard-ai-db
    plan: free
    region: singapore
    databaseName: vulnguard_ai
    user: vulnguard_ai
    ipAllowList: []
